name: Daily Korea Economy News

on:
  schedule:
    # 08:00 KST is 23:00 UTC on the previous day.
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Firebase credentials
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: |
          test -n "$FIREBASE_CREDENTIALS_JSON"
          printf '%s' "$FIREBASE_CREDENTIALS_JSON" > serviceAccountKey.json
          chmod 600 serviceAccountKey.json

      - name: Validate runtime environment
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          FIREBASE_CREDENTIALS_PATH: serviceAccountKey.json
        run: python scripts/check_env.py --strict

      - name: Run news pipeline
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          FIREBASE_CREDENTIALS_PATH: serviceAccountKey.json
        run: python main.py
